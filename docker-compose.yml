services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env

  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - BASE_URL=http://api:8000
